# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
  repo  = "https://github.com/tombi-toml/tombi-pre-commit"
  rev   = "v1.5.5"
  hooks = [
    {id = "tombi-format", args = ["--check", "--diff", "pyproject.toml"]},
    {id = "tombi-lint", args = ["pyproject.toml"]}
  ]

[[repos]]
  repo  = "https://github.com/DavidAnson/markdownlint-cli2"
  rev   = "v0.23.2"
  hooks = [{id = "markdownlint-cli2"}]

[[repos]]
  repo  = "https://github.com/streetsidesoftware/cspell-cli"
  rev   = "v10.2.0"
  hooks = [{id = "cspell"}]

[[repos]]
  repo  = "https://github.com/abravalheri/validate-pyproject"
  rev   = "0.26"
  hooks = [{id = "validate-pyproject"}]

[[repos]]
  repo  = "https://github.com/astral-sh/ruff-pre-commit"
  rev   = "v0.16.7"
  hooks = [{id = "ruff-check", args = ["--exit-non-zero-on-fix"]}, {id = "ruff-format"}]

[[repos]]
  repo  = "https://github.com/jsh9/pydoclint"
  rev   = "0.9.1"
  hooks = [{id = "pydoclint"}]

[[repos]]
  repo  = "https://github.com/sphinx-contrib/sphinx-lint"
  rev   = "v1.0.2"
  hooks = [{id = "sphinx-lint", args = ["docs"]}]

[[repos]]
  repo  = "https://github.com/pre-commit/mirrors-mypy"
  rev   = "v2.3.1"
  hooks = [
    {
      id                      = "mypy",
      args                    = ["--strict", "--ignore-missing-imports"],
      additional_dependencies = [
        "msgspec==0.19.0",
        "urllib3==2.4.0",
        "pytest==8.3.5",
        "pytest-mock==3.14.1"
      ]
    }
  ]

[[repos]]
  repo  = "https://github.com/zizmorcore/zizmor-pre-commit"
  rev   = "v1.30.1"
  hooks = [{id = "zizmor", args = ["--persona", "pedantic"]}]

[[repos]]
  repo  = "https://github.com/pre-commit/pre-commit-hooks"
  rev   = "v6.0.0"
  hooks = [{id = "check-ast"}, {id = "check-builtin-literals"}]

[[repos]]
  repo  = "builtin"
  hooks = [
    {id = "check-case-conflict"},
    {id = "check-toml"},
    {id = "check-yaml"},
    {id = "detect-private-key"},
    {id = "mixed-line-ending"}
  ]
